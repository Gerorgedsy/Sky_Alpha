name: Live airport data

# Refreshes the static snapshots the website falls back to when the live
# backend is unreachable: FAA airport events and NOAA weather every run, and
# AirLabs schedules at most every six hours (to stay inside the free quota).
#
# The snapshots live on the `live-data` branch, which always holds a single
# commit, so main's history is not filled with data updates. The page reads
# them from raw.githubusercontent.com.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_schedules:
        description: "Refresh AirLabs schedules now, even if they are recent"
        type: boolean
        default: false
      force_predictions:
        description: "Kept for the training job's trigger; every run re-scores"
        type: boolean
        default: false

concurrency:
  group: live-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # Start from the previous snapshot so recent schedules are kept.
      - name: Restore previous snapshot
        run: |
          mkdir -p live
          if git fetch --depth=1 origin live-data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C live
          fi

      - name: Refresh snapshot
        env:
          PYTHONPATH: src
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
        run: |
          python -m skydelay.live.snapshot --output live \
            ${{ inputs.force_schedules && '--force-schedules' || '' }}

      # Delay predictions for today and tomorrow (New York time), re-scored on
      # every run with the weather and departure delays just fetched.
      - name: Fetch the trained models
        id: predictions
        run: |
          if git fetch --depth=1 origin model-artifacts 2>/dev/null; then
            mkdir -p models && git archive FETCH_HEAD | tar -x -C models
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No trained models yet."; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install prediction dependencies
        if: steps.predictions.outputs.run == 'true'
        run: pip install $(grep -E '^(numpy|pandas|pyarrow|scikit-learn|joblib)==' requirements.txt)

      - name: Score today's and tomorrow's flights
        if: steps.predictions.outputs.run == 'true'
        env:
          PYTHONPATH: src
        run: |
          python -m skydelay.models.nyc_delay predict --artifacts models \
            --output live/predictions.json --days 2 \
            --operations live/operations.json --schedules live/schedules.json

      - name: Publish to the live-data branch
        working-directory: live
        run: |
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: live airport snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
